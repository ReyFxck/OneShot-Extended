name: Temporary build - WiFi WPS WPA Tester

on:
  push:
    branches:
      - tmp-build-wps-tester-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout upstream app
        uses: actions/checkout@v4
        with:
          repository: fulvius31/wifi-wps-wpa-tester-opensource
          ref: main
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Build OpenDebug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleOpenDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wifi-wps-wpa-tester-open-debug
          path: upstream/app/build/outputs/apk/open/debug/*.apk
          if-no-files-found: error
          retention-days: 1
